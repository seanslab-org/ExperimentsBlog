    <circle cx="262" cy="225" r="3" opacity="0.65"/>
    <circle cx="295" cy="255" r="2" opacity="0.4"/>
    <circle cx="120" cy="295" r="3.5" opacity="0.55"/>
    <circle cx="155" cy="320" r="2.5" opacity="0.5"/>
    <circle cx="185" cy="298" r="2" opacity="0.4"/>
    <circle cx="220" cy="328" r="4" opacity="0.7"/>
    <circle cx="252" cy="305" r="3" opacity="0.55"/>
    <circle cx="290" cy="335" r="2.5" opacity="0.5"/>
    <circle cx="135" cy="355" r="3" opacity="0.55"/>
    <circle cx="170" cy="370" r="2" opacity="0.4"/>
    <circle cx="200" cy="345" r="3.5" opacity="0.6"/>
    <circle cx="240" cy="370" r="2.5" opacity="0.5"/>
    <circle cx="280" cy="350" r="3" opacity="0.55"/>
    <circle cx="320" cy="310" r="2" opacity="0.45"/>
    <circle cx="340" cy="270" r="3" opacity="0.6"/>
    <circle cx="355" cy="335" r="2.5" opacity="0.5"/>
    <circle cx="380" cy="295" r="3.5" opacity="0.65"/>
    <circle cx="405" cy="320" r="2" opacity="0.45"/>
    <circle cx="100" cy="380" r="3" opacity="0.5"/>
    <circle cx="170" cy="225" r="2" opacity="0.4"/>
    <circle cx="225" cy="395" r="2.5" opacity="0.5"/>
    <circle cx="295" cy="395" r="3" opacity="0.55"/>
    <circle cx="370" cy="240" r="2.5" opacity="0.5"/>
    <circle cx="395" cy="380" r="3.5" opacity="0.6"/>
    <circle cx="425" cy="265" r="2.5" opacity="0.5"/>
    <circle cx="445" cy="345" r="2" opacity="0.45"/>
    <circle cx="80" cy="320" r="2" opacity="0.4"/>
    <circle cx="265" cy="395" r="2" opacity="0.4"/>
    <circle cx="335" cy="395" r="2.5" opacity="0.5"/>
    <circle cx="430" cy="225" r="3" opacity="0.6"/>
  </g>

  <!-- Left label -->
  <text x="265" y="225" text-anchor="middle" font-size="11" fill="#888" letter-spacing="2">高熵 · 高维选项</text>

  <!-- Middle: demon hexagon (sorting gate) -->
  <polygon points="600,275 645,300 645,360 600,385 555,360 555,300" fill="#1a1a1a"/>
  <text x="600" y="328" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">市场</text>
  <text x="600" y="346" text-anchor="middle" font-size="9" fill="#ccc" font-style="italic">demon</text>

  <!-- Energy input -->
  <line x1="600" y1="445" x2="600" y2="395" stroke="#c4453d" stroke-width="1.5" stroke-dasharray="2,2"/>
