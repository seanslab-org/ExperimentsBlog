  <!-- Right side: clean ordered survivors (low entropy) -->
  <g fill="#1a1a1a">
    <circle cx="780" cy="320" r="18"/>
    <circle cx="855" cy="320" r="18"/>
    <circle cx="930" cy="320" r="18"/>
    <circle cx="1005" cy="320" r="18"/>
    <circle cx="1080" cy="320" r="18"/>
  </g>

  <!-- Right label -->
  <text x="930" y="225" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="600" letter-spacing="2">低熵 · 存活</text>
  <text x="930" y="380" text-anchor="middle" font-size="11" fill="#444">Windows · iOS · Python · Claude · Apple</text>

  <!-- Subtle connecting flow lines -->
  <path d="M 460 310 Q 510 320 555 330" fill="none" stroke="#bbb" stroke-width="1" opacity="0.5"/>
  <path d="M 645 330 Q 700 320 755 320" fill="none" stroke="#bbb" stroke-width="1" opacity="0.5"/>

  <!-- Author info bottom -->
  <text x="600" y="465" text-anchor="middle" font-size="10" fill="#aaa">Sean · seanslab.org · 用信息论看世界</text>
