<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#444"/>
    </marker>
    <marker id="arrowRed2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#c4453d"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#fbfbf9"/>

  <text x="600" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">AI 顶尖人才的血统树 · 实验室分裂出实验室</text>
  <text x="600" y="64" text-anchor="middle" font-size="13" fill="#666">每一条箭头都是一次虫洞 · 研究员把上一代实验室的研究直接拿走变成新公司</text>

  <!-- OpenAI cluster -->
  <g transform="translate(80, 130)">
    <rect x="0" y="0" width="180" height="60" fill="#1a1a1a"/>
    <text x="90" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">OpenAI</text>
    <text x="90" y="48" text-anchor="middle" font-size="10" fill="#aaa">2015 创办</text>
  </g>

  <!-- Anthropic -->
  <line x1="260" y1="160" x2="380" y2="160" stroke="#c4453d" stroke-width="2" marker-end="url(#arrowRed2)"/>
  <text x="320" y="148" text-anchor="middle" font-size="10" fill="#c4453d" font-style="italic">2021 · 11 人出走</text>
  <g transform="translate(390, 130)">
    <rect x="0" y="0" width="200" height="60" fill="#fff" stroke="#c4453d" stroke-width="2"/>
    <text x="100" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#c4453d">Anthropic</text>
    <text x="100" y="42" text-anchor="middle" font-size="10" fill="#555">Dario · Daniela Amodei</text>
    <text x="100" y="55" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="600">2025 估值 1830 亿</text>
  </g>

  <!-- Google Brain cluster -->
  <g transform="translate(80, 270)">
    <rect x="0" y="0" width="180" height="60" fill="#1a1a1a"/>
    <text x="90" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Google Brain</text>
    <text x="90" y="48" text-anchor="middle" font-size="10" fill="#aaa">2011 创办</text>
  </g>

  <!-- Character.AI -->
  <line x1="260" y1="290" x2="380" y2="280" stroke="#c4453d" stroke-width="2" marker-end="url(#arrowRed2)"/>
  <text x="320" y="270" text-anchor="middle" font-size="10" fill="#c4453d" font-style="italic">2021 · Shazeer 出走</text>
  <g transform="translate(390, 250)">
    <rect x="0" y="0" width="200" height="60" fill="#fff" stroke="#c4453d" stroke-width="2"/>
    <text x="100" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#c4453d">Character.AI</text>
    <text x="100" y="42" text-anchor="middle" font-size="10" fill="#555">Shazeer · De Freitas</text>
    <text x="100" y="55" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="600">2023 估值 50 亿</text>
  </g>

  <!-- Character.AI back to Google -->
  <line x1="590" y1="280" x2="720" y2="280" stroke="#444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowDark)"/>
  <text x="655" y="270" text-anchor="middle" font-size="10" fill="#444" font-style="italic">2024 · 27 亿 license</text>
  <g transform="translate(730, 250)">
    <rect x="0" y="0" width="200" height="60" fill="#f0f0f0" stroke="#444" stroke-width="1.5"/>
    <text x="100" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#444">Google Gemini</text>
    <text x="100" y="42" text-anchor="middle" font-size="10" fill="#555">Shazeer 回归 co-lead</text>
    <text x="100" y="55" text-anchor="middle" font-size="11" fill="#444" font-style="italic">"虫洞往返"</text>
  </g>

  <!-- Adept (failed) -->
  <line x1="260" y1="310" x2="380" y2="350" stroke="#888" stroke-width="2" marker-end="url(#arrowRed2)"/>
  <text x="320" y="340" text-anchor="middle" font-size="10" fill="#888" font-style="italic">2022 · Vaswani</text>
  <g transform="translate(390, 340)">
    <rect x="0" y="0" width="200" height="60" fill="#fff" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="100" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#888">Adept AI</text>
    <text x="100" y="42" text-anchor="middle" font-size="10" fill="#aaa">Vaswani · Parmar · Luan</text>
    <text x="100" y="55" text-anchor="middle" font-size="10" fill="#888" font-style="italic">2024 失败 → Amazon</text>
  </g>

  <!-- Essential AI -->
  <line x1="590" y1="370" x2="720" y2="370" stroke="#c4453d" stroke-width="2" marker-end="url(#arrowRed2)"/>
  <text x="655" y="360" text-anchor="middle" font-size="10" fill="#c4453d" font-style="italic">2023 · 第二次虫洞</text>
  <g transform="translate(730, 340)">
    <rect x="0" y="0" width="200" height="60" fill="#fff" stroke="#c4453d" stroke-width="2"/>
    <text x="100" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#c4453d">Essential AI</text>
    <text x="100" y="42" text-anchor="middle" font-size="10" fill="#555">Vaswani</text>
    <text x="100" y="55" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="600">2025 估值 10 亿</text>
  </g>

  <!-- DeepMind cluster -->
  <g transform="translate(80, 480)">
    <rect x="0" y="0" width="180" height="60" fill="#1a1a1a"/>
    <text x="90" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">DeepMind</text>
    <text x="90" y="48" text-anchor="middle" font-size="10" fill="#aaa">Google 2014 收购</text>
  </g>

  <!-- Mistral -->
  <line x1="260" y1="500" x2="380" y2="490" stroke="#c4453d" stroke-width="2" marker-end="url(#arrowRed2)"/>
  <text x="320" y="480" text-anchor="middle" font-size="10" fill="#c4453d" font-style="italic">2023 · 3 人出走</text>
  <g transform="translate(390, 460)">
    <rect x="0" y="0" width="200" height="60" fill="#fff" stroke="#c4453d" stroke-width="2"/>
    <text x="100" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#c4453d">Mistral AI</text>
    <text x="100" y="42" text-anchor="middle" font-size="10" fill="#555">Mensch · Lample · Lacroix</text>
    <text x="100" y="55" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="600">PPT 融 1.13 亿</text>
  </g>

  <!-- Inflection (failed) -->
  <line x1="260" y1="520" x2="380" y2="560" stroke="#888" stroke-width="2" marker-end="url(#arrowRed2)"/>
  <text x="320" y="555" text-anchor="middle" font-size="10" fill="#888" font-style="italic">2022 · Suleyman</text>
  <g transform="translate(390, 550)">
    <rect x="0" y="0" width="200" height="60" fill="#fff" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="100" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#888">Inflection AI</text>
    <text x="100" y="42" text-anchor="middle" font-size="10" fill="#aaa">Suleyman · Hoffman</text>
    <text x="100" y="55" text-anchor="middle" font-size="10" fill="#888" font-style="italic">2024 失败 → Microsoft</text>
  </g>

  <!-- Inflection to Microsoft -->
  <line x1="590" y1="580" x2="720" y2="580" stroke="#444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowDark)"/>
  <text x="655" y="570" text-anchor="middle" font-size="10" fill="#444" font-style="italic">2024 · team license-bought</text>
  <g transform="translate(730, 550)">
    <rect x="0" y="0" width="200" height="60" fill="#f0f0f0" stroke="#444" stroke-width="1.5"/>
    <text x="100" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#444">Microsoft AI</text>
    <text x="100" y="42" text-anchor="middle" font-size="10" fill="#555">Suleyman 入职 CEO</text>
    <text x="100" y="55" text-anchor="middle" font-size="11" fill="#444" font-style="italic">"失败也回不去转化"</text>
  </g>

  <!-- Legend / annotation -->
  <g transform="translate(960, 130)">
    <text x="0" y="0" font-size="12" fill="#1a1a1a" font-weight="600">图例</text>
    <rect x="0" y="14" width="14" height="14" fill="#fff" stroke="#c4453d" stroke-width="2"/>
    <text x="22" y="25" font-size="11" fill="#1a1a1a">活跃中的虫洞</text>
    <rect x="0" y="36" width="14" height="14" fill="#fff" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="22" y="47" font-size="11" fill="#888">失败的虫洞</text>
    <line x1="0" y1="68" x2="14" y2="68" stroke="#c4453d" stroke-width="2"/>
    <text x="22" y="72" font-size="11" fill="#1a1a1a">研究员出走</text>
    <line x1="0" y1="88" x2="14" y2="88" stroke="#444" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="22" y="92" font-size="11" fill="#1a1a1a">大厂回收 / 反向虫洞</text>
  </g>

  <!-- Bottom annotation -->
  <text x="600" y="690" text-anchor="middle" font-size="11" fill="#444" font-style="italic">实验室不再是研究的归宿 · 它变成了虫洞的工厂 · 即使失败，研究员也直接被大厂 license 走，再开下一个虫洞</text>
</svg>
