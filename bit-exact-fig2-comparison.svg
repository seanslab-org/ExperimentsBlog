<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#c4453d"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#fbfbf9"/>

  <text x="600" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Bit-exact 没死——它升了一级</text>
  <text x="600" y="64" text-anchor="middle" font-size="13" fill="#666">同样的工程严格性，从 application 层搬到了 harness 层</text>

  <!-- Column headers -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="500" height="50" fill="#888"/>
    <text x="250" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">旧 bit-exact · application 层</text>
    <text x="250" y="46" text-anchor="middle" font-size="10" fill="#ddd">2002 · GSM-EFR codec 在 ADI 218x DSP</text>
  </g>

  <g transform="translate(620, 100)">
    <rect x="0" y="0" width="500" height="50" fill="#c4453d"/>
    <text x="250" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">新 bit-exact · harness 层</text>
    <text x="250" y="46" text-anchor="middle" font-size="10" fill="#fff" opacity="0.85">2026 · LLM 应用在 LangSmith / Braintrust / Evals</text>
  </g>

  <!-- Row 1 -->
  <g transform="translate(0, 170)">
    <rect x="80" y="0" width="500" height="56" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
    <text x="100" y="34" font-size="13" fill="#1a1a1a">Codec 实现的每一个 sample</text>
    <rect x="620" y="0" width="500" height="56" fill="#fff" stroke="#c4453d" stroke-width="1"/>
    <text x="640" y="34" font-size="13" fill="#1a1a1a">Eval 数据集的每一条 record</text>
    <line x1="580" y1="28" x2="620" y2="28" stroke="#c4453d" stroke-width="1.5" marker-end="url(#arrowR)"/>
  </g>

  <!-- Row 2 -->
  <g transform="translate(0, 235)">
    <rect x="80" y="0" width="500" height="56" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
    <text x="100" y="34" font-size="13" fill="#1a1a1a">ITU 提供的 reference output</text>
    <rect x="620" y="0" width="500" height="56" fill="#fff" stroke="#c4453d" stroke-width="1"/>
    <text x="640" y="34" font-size="13" fill="#1a1a1a">Human-labeled ground truth</text>
    <line x1="580" y1="28" x2="620" y2="28" stroke="#c4453d" stroke-width="1.5" marker-end="url(#arrowR)"/>
  </g>

  <!-- Row 3 -->
  <g transform="translate(0, 300)">
    <rect x="80" y="0" width="500" height="56" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
    <text x="100" y="34" font-size="13" fill="#1a1a1a">输出 bit-exact 匹配 reference = 通过</text>
    <rect x="620" y="0" width="500" height="56" fill="#fff" stroke="#c4453d" stroke-width="1"/>
    <text x="640" y="34" font-size="13" fill="#1a1a1a">eval 跟基线的统计差异 &lt; 阈值 = 通过</text>
    <line x1="580" y1="28" x2="620" y2="28" stroke="#c4453d" stroke-width="1.5" marker-end="url(#arrowR)"/>
  </g>

  <!-- Row 4 -->
  <g transform="translate(0, 365)">
    <rect x="80" y="0" width="500" height="56" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
    <text x="100" y="34" font-size="13" fill="#1a1a1a">每次 commit 跑 regression test</text>
    <rect x="620" y="0" width="500" height="56" fill="#fff" stroke="#c4453d" stroke-width="1"/>
    <text x="640" y="34" font-size="13" fill="#1a1a1a">每次 prompt / 模型变更跑 regression eval</text>
    <line x1="580" y1="28" x2="620" y2="28" stroke="#c4453d" stroke-width="1.5" marker-end="url(#arrowR)"/>
  </g>

  <!-- Row 5 -->
  <g transform="translate(0, 430)">
    <rect x="80" y="0" width="500" height="56" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
    <text x="100" y="34" font-size="13" fill="#1a1a1a">Stack trace 精确到行</text>
    <rect x="620" y="0" width="500" height="56" fill="#fff" stroke="#c4453d" stroke-width="1"/>
    <text x="640" y="34" font-size="13" fill="#1a1a1a">Trace + intermediate state 精确到 token</text>
    <line x1="580" y1="28" x2="620" y2="28" stroke="#c4453d" stroke-width="1.5" marker-end="url(#arrowR)"/>
  </g>

  <!-- Row 6 -->
  <g transform="translate(0, 495)">
    <rect x="80" y="0" width="500" height="56" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
    <text x="100" y="34" font-size="13" fill="#1a1a1a">测试集 · ITU 几千个 .pcm 向量</text>
    <rect x="620" y="0" width="500" height="56" fill="#fff" stroke="#c4453d" stroke-width="1"/>
    <text x="640" y="34" font-size="13" fill="#1a1a1a">测试集 · human-labeled 几万条 ground truth</text>
    <line x1="580" y1="28" x2="620" y2="28" stroke="#c4453d" stroke-width="1.5" marker-end="url(#arrowR)"/>
  </g>

  <!-- Row 7 -->
  <g transform="translate(0, 560)">
    <rect x="80" y="0" width="500" height="56" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
    <text x="100" y="34" font-size="13" fill="#1a1a1a">Reference output 永远不变</text>
    <rect x="620" y="0" width="500" height="56" fill="#fff" stroke="#c4453d" stroke-width="1"/>
    <text x="640" y="34" font-size="13" fill="#1a1a1a">Eval rubric + 评分模型 + temperature 全部锁版本</text>
    <line x1="580" y1="28" x2="620" y2="28" stroke="#c4453d" stroke-width="1.5" marker-end="url(#arrowR)"/>
  </g>

  <!-- Summary box -->
  <g transform="translate(80, 660)">
    <rect x="0" y="0" width="1040" height="100" fill="#fff5f4" stroke="#c4453d" stroke-width="1.5"/>
    <text x="520" y="38" text-anchor="middle" font-size="14" font-weight="700" fill="#c4453d">你的 LLM 输出是概率的，但你的 LLM eval pipeline 必须 bit-exact</text>
    <text x="520" y="64" text-anchor="middle" font-size="12" fill="#1a1a1a">否则你根本无法判断今天的实验比昨天好了还是坏了</text>
    <text x="520" y="86" text-anchor="middle" font-size="11" fill="#888" font-style="italic">工程师追求严格的位置变了 · 强度没变</text>
  </g>
</svg>
