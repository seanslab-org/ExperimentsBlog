<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#888"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#c4453d"/>
    </marker>
  </defs>
  <rect width="1200" height="480" fill="#fbfbf9"/>

  <text x="600" y="50" text-anchor="middle" font-size="11" fill="#888" letter-spacing="6">SEANSLAB · 用信息论看世界</text>

  <text x="600" y="110" text-anchor="middle" font-size="34" font-weight="700" fill="#1a1a1a">研究到产品的距离已经归零</text>
  <text x="600" y="146" text-anchor="middle" font-size="18" fill="#555">AI 时代的科研虫洞</text>

  <line x1="520" y1="168" x2="680" y2="168" stroke="#c4453d" stroke-width="1.5"/>

  <g transform="translate(150, 220)">
    <text x="0" y="0" font-size="13" fill="#888" font-weight="500">二十世纪 · 五段有损通道</text>
    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="120" height="38" fill="#fff" stroke="#888" stroke-width="1"/>
      <text x="60" y="24" text-anchor="middle" font-size="13" fill="#555">研究</text>
      <line x1="120" y1="19" x2="142" y2="19" stroke="#aaa" stroke-width="1" marker-end="url(#arrowGray)"/>
      <rect x="144" y="0" width="120" height="38" fill="#fff" stroke="#888" stroke-width="1"/>
      <text x="204" y="24" text-anchor="middle" font-size="13" fill="#555">研发</text>
      <line x1="264" y1="19" x2="286" y2="19" stroke="#aaa" stroke-width="1" marker-end="url(#arrowGray)"/>
      <rect x="288" y="0" width="120" height="38" fill="#fff" stroke="#888" stroke-width="1"/>
      <text x="348" y="24" text-anchor="middle" font-size="13" fill="#555">工程</text>
      <line x1="408" y1="19" x2="430" y2="19" stroke="#aaa" stroke-width="1" marker-end="url(#arrowGray)"/>
      <rect x="432" y="0" width="120" height="38" fill="#fff" stroke="#888" stroke-width="1"/>
      <text x="492" y="24" text-anchor="middle" font-size="13" fill="#555">生产</text>
      <line x1="552" y1="19" x2="574" y2="19" stroke="#aaa" stroke-width="1" marker-end="url(#arrowGray)"/>
      <rect x="576" y="0" width="120" height="38" fill="#fff" stroke="#888" stroke-width="1"/>
      <text x="636" y="24" text-anchor="middle" font-size="13" fill="#555">分发</text>
      <line x1="696" y1="19" x2="718" y2="19" stroke="#aaa" stroke-width="1" marker-end="url(#arrowGray)"/>
      <rect x="720" y="0" width="120" height="38" fill="#fff" stroke="#888" stroke-width="1"/>
      <text x="780" y="24" text-anchor="middle" font-size="13" fill="#555">用户</text>
    </g>
    <text x="420" y="86" text-anchor="middle" font-size="11" fill="#888" font-style="italic">每段几年延迟 · 大量信息丢失 · "科研成果转化"作为产业存在</text>
  </g>

  <g transform="translate(150, 360)">
    <text x="0" y="0" font-size="13" fill="#c4453d" font-weight="500">AI 时代 · 一段近无损通道</text>
    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="280" height="38" fill="#c4453d" stroke="#c4453d"/>
      <text x="140" y="24" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">研究 ≡ 产品</text>
      <line x1="280" y1="19" x2="714" y2="19" stroke="#c4453d" stroke-width="2" marker-end="url(#arrowRed)"/>
      <rect x="720" y="0" width="120" height="38" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
      <text x="780" y="24" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="600">用户</text>
    </g>
    <text x="420" y="86" text-anchor="middle" font-size="11" fill="#c4453d" font-style="italic">arXiv + GitHub + HuggingFace + 开源权重 + Researcher = Founder · 码本统一</text>
  </g>
</svg>
