<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrowF3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4453d"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a1a">稀缺性的转移</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#555">筛选越严，稀缺往哪里跑</text>

  <!-- Left side: 筛选之前 -->
  <g transform="translate(40, 80)">
    <text x="160" y="16" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">筛选之前</text>
    <text x="160" y="34" text-anchor="middle" font-size="10" fill="#555">稀缺散落在所有 niche 选择上</text>

    <g font-size="9" fill="#666">
      <circle cx="40" cy="80" r="4" fill="#888"/>
      <text x="50" y="84">OCaml</text>
      <circle cx="180" cy="78" r="4" fill="#888"/>
      <text x="190" y="82">BeOS</text>
      <circle cx="60" cy="115" r="4" fill="#888"/>
      <text x="70" y="119">Symbian app</text>
      <circle cx="200" cy="120" r="4" fill="#888"/>
      <text x="210" y="124">Atari TOS</text>
      <circle cx="35" cy="155" r="4" fill="#888"/>
      <text x="45" y="159">独立工具链</text>
      <circle cx="180" cy="160" r="4" fill="#888"/>
      <text x="190" y="164">小语言</text>
      <circle cx="100" cy="195" r="4" fill="#888"/>
      <text x="110" y="199">手写脚本</text>
      <circle cx="220" cy="200" r="4" fill="#888"/>
      <text x="230" y="204">niche 框架</text>
      <circle cx="50" cy="235" r="4" fill="#888"/>
      <text x="60" y="239">Smalltalk</text>
      <circle cx="190" cy="240" r="4" fill="#888"/>
      <text x="200" y="244">DSL</text>
      <circle cx="120" cy="270" r="4" fill="#888"/>
      <text x="130" y="274">Common Lisp</text>
      <circle cx="40" cy="300" r="4" fill="#888"/>
      <text x="50" y="304">Erlang</text>
      <circle cx="170" cy="300" r="4" fill="#888"/>
      <text x="180" y="304">自己的 IDE</text>
    </g>
  </g>

  <!-- Center arrow -->
  <line x1="370" y1="220" x2="450" y2="220" stroke="#c4453d" stroke-width="2.5" marker-end="url(#arrowF3)"/>
  <text x="410" y="200" text-anchor="middle" font-size="11" fill="#c4453d" font-weight="600">市场筛选</text>

  <!-- Right side: 筛选之后 -->
  <g transform="translate(450, 80)">
    <text x="160" y="16" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">筛选之后</text>
    <text x="160" y="34" text-anchor="middle" font-size="10" fill="#555">稀缺塌进两个核心判断</text>

    <!-- Faded background dots (the old niches, now worthless) -->
    <g fill="#e0e0e0">
      <circle cx="30" cy="80" r="3"/>
      <circle cx="280" cy="80" r="3"/>
      <circle cx="50" cy="115" r="3"/>
      <circle cx="270" cy="120" r="3"/>
      <circle cx="35" cy="155" r="3"/>
      <circle cx="290" cy="160" r="3"/>
      <circle cx="40" cy="220" r="3"/>
      <circle cx="280" cy="220" r="3"/>
      <circle cx="50" cy="270" r="3"/>
      <circle cx="285" cy="270" r="3"/>
      <circle cx="35" cy="305" r="3"/>
      <circle cx="290" cy="305" r="3"/>
    </g>

    <!-- Two bright concentrated points -->
    <circle cx="160" cy="135" r="42" fill="#c4453d" opacity="0.12"/>
    <circle cx="160" cy="135" r="24" fill="#c4453d" opacity="0.30"/>
    <circle cx="160" cy="135" r="10" fill="#c4453d"/>
    <text x="160" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">该不该做</text>
    <text x="160" y="207" text-anchor="middle" font-size="9" fill="#666">判断什么值得做</text>

    <circle cx="160" cy="270" r="42" fill="#c4453d" opacity="0.12"/>
    <circle cx="160" cy="270" r="24" fill="#c4453d" opacity="0.30"/>
    <circle cx="160" cy="270" r="10" fill="#c4453d"/>
    <text x="160" y="325" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">有没有审美</text>
    <text x="160" y="342" text-anchor="middle" font-size="9" fill="#666">判断做出来的东西</text>
  </g>

  <!-- Bottom annotation -->
  <text x="400" y="425" text-anchor="middle" font-size="11" fill="#444" font-style="italic">技术能力是 demon 的工作 · 审美判断是 demon 拿不走的部分</text>
</svg>
